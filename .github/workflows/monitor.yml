name: STRK Whale Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: strk-data-file
  cancel-in-progress: false

jobs:
  check-whales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          STARKNET_RPC_URL: ${{ secrets.STARKNET_RPC_URL }}
        run: python monitor.py

      - name: Commit updated data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          touch data/transfers.jsonl
          git add -A
          git diff --quiet --cached && exit 0
          git commit -m "Update data file"
          git push
